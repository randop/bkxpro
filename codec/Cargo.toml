[package]
name = "bkxpro-codec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BookKeeper-style staging segment codec for RAN-126"

[dependencies]
bytes = "1.10"
crc32c = "0.6"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
proptest = "1.6"
criterion = "0.5"

[[bench]]
name = "crc32c"
harness = false

[[bench]]
name = "encoder"
harness = false
