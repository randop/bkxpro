[package]
name = "bkxpro-indexer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "fjall-backed index and rebuild-from-segments for bkxpro"

[dependencies]
bkxpro-codec = { path = "../codec" }
bkxpro-segmenter = { path = "../segmenter" }
bytes = "1.10"
fjall = "3.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
bincode = "1.3"

[dev-dependencies]
crc32c = "0.6"
bkxpro-io = { path = "../io" }
tempfile = "3.8"